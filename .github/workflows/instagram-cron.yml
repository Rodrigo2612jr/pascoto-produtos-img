name: Refresh Instagram Feed

on:
  schedule:
    # Roda toda madrugada 03:00 BRT (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Permite rodar manualmente pelo botao "Run workflow"

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Instagram posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python <<'PY'
          import urllib.request, json, os, sys
          token = os.environ['IG_TOKEN']
          fields = 'id,caption,media_type,media_url,thumbnail_url,permalink,timestamp'
          url = f'https://graph.instagram.com/v21.0/me/media?fields={fields}&limit=8&access_token={token}'
          r = urllib.request.urlopen(url, timeout=30)
          data = json.loads(r.read().decode('utf-8')).get('data', [])
          out = []
          for p in data:
              mt = p.get('media_type', 'IMAGE')
              thumb = p.get('thumbnail_url' if mt == 'VIDEO' else 'media_url') or p.get('media_url', '')
              caption = (p.get('caption') or '').strip()
              out.append({
                  'url': p.get('permalink', ''),
                  'thumbnail': thumb,
                  'caption': caption,
                  'alt': caption[:80] if caption else 'Post do Emporio Pascoto no Instagram',
                  'media_type': mt,
                  'timestamp': p.get('timestamp', ''),
              })
          with open('instagram-posts.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print(f'OK: {len(out)} posts salvos em instagram-posts.json')
          PY

      - name: Refresh token (extend long-lived)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python <<'PY'
          import urllib.request, json, os
          token = os.environ['IG_TOKEN']
          # Renova o token Instagram Business (long-lived) — extende validade
          url = f'https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token={token}'
          try:
              r = urllib.request.urlopen(url, timeout=20)
              data = json.loads(r.read().decode())
              print(f'Token renovado, expira em {data.get("expires_in", 0)//86400} dias')
              # Escreve novo token pra ser pego pelo proximo passo
              with open('/tmp/new_token.txt', 'w') as f:
                  f.write(data.get('access_token', ''))
          except Exception as e:
              print(f'Aviso: refresh falhou ({e}). Token atual ainda funciona.')
          PY

      - name: Commit and push (se houve mudanca)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram-posts.json
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca nos posts."
          else
            git commit -m "chore: refresh instagram posts feed [skip ci]"
            git push
          fi
