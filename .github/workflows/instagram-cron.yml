name: Refresh Instagram Feed

on:
  schedule:
    # Roda toda madrugada 03:00 BRT (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Permite rodar manualmente pelo botao "Run workflow"

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # O script baixa as miniaturas pra pasta ig/ e aponta o JSON pra ca.
      # As URLs do CDN do Instagram sao assinadas e expiram em poucos dias: guardar
      # a URL crua fazia o feed do site cair sempre que este cron falhava.
      - name: Fetch Instagram posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/refresh_instagram.py

      - name: Refresh token (extend long-lived)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          python <<'PY'
          import urllib.request, json, os
          token = os.environ['IG_TOKEN']
          url = f'https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token={token}'
          try:
              r = urllib.request.urlopen(url, timeout=20)
              data = json.loads(r.read().decode())
              print(f'Token renovado, expira em {data.get("expires_in", 0)//86400} dias')
          except Exception as e:
              print(f'Aviso: refresh falhou ({e}). Token atual ainda funciona.')
          # ATENCAO: isto so estende a validade no lado do Instagram. O segredo
          # IG_TOKEN do repo NAO e reescrito aqui: se um dia o feed parar com erro
          # de auth, gerar token novo e atualizar o segredo na mao.
          PY

      - name: Commit and push (se houve mudanca)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram-posts.json ig
          if git diff --staged --quiet; then
            echo "Nenhuma mudanca nos posts."
          else
            git commit -m "chore: refresh instagram posts feed [skip ci]"
            git push
          fi
