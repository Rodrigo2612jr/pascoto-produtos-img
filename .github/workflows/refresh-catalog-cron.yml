name: Refresh Catalog — Coleções fantasma + preços

on:
  schedule:
    # 03:40 BRT (06:40 UTC). Sai de cima do Instagram cron (06:00): os dois
    # commitam no mesmo repo e colidiam no push.
    - cron: '40 6 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run refresh script
        run: python scripts/refresh_catalog.py

      - name: Indice da busca (autocomplete da lupa)
        run: python scripts/search_index.py

      - name: Commit if changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-vitrines.json search-index.json
          if git diff --cached --quiet; then
            echo "Sem mudanças no JSON, pulando commit."
            exit 0
          fi
          git commit -m "chore: refresh home-vitrines.json (cron diário)"
          # push com rebase e retry: os crons deste repo commitam no mesmo
          # arquivo e o push sem rebase era rejeitado ("fetch first"), o que
          # fazia este job falhar TODO DIA desde que os dois crons passaram a
          # rodar no mesmo horario.
          for tentativa in 1 2 3; do
            if git push; then
              echo "push ok na tentativa $tentativa"
              exit 0
            fi
            echo "push rejeitado, sincronizando e tentando de novo..."
            git pull --rebase origin main || exit 1
          done
          echo "push falhou apos 3 tentativas"
          exit 1
