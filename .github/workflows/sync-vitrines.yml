name: sync-vitrines

on:
  schedule:
    - cron: '7 * * * *'   # toda hora, no minuto 7
  workflow_dispatch:        # botao manual (rodar na hora)

permissions:
  contents: write

concurrency:
  group: sync-vitrines
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar imagens das vitrines
        run: python update_vitrines.py

      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add home-vitrines.json
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            git commit -m "auto-sync: imagens das vitrines atualizadas"
            for tentativa in 1 2 3; do
              git push && break
              echo "push rejeitado, sincronizando..."
              git pull --rebase origin main || exit 1
            done
          fi
